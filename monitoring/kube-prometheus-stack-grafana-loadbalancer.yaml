apiVersion: v1
kind: Service
metadata:
  name: kube-prometheus-stack-grafana-loadbalancer
  namespace: monitoring
  labels:
    app.kubernetes.io/name: grafana
spec:
  ports:
    - name: port-1
      port: 3000
      protocol: TCP
      targetPort: 3000
  selector:
    app.kubernetes.io/instance: kube-prometheus-stack
    app.kubernetes.io/name: grafana
  type: LoadBalancer
