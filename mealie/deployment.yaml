apiVersion: apps/v1
kind: Deployment
metadata:
  name: mealie
  labels:
    app: mealie
  namespace: mealie
spec:
  replicas: 1
  selector:
    matchLabels:
      pod: mealie
  template:
    metadata:
      labels:
        pod: mealie
    spec:
      containers:
      - name: mealie
        image: ghcr.io/mealie-recipes/mealie:v3.19.1
        ports:
        - containerPort: 9000
